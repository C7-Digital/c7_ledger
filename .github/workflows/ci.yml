name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# NOTE: The Daml SDK version (currently 3.4.11) is pinned in
# scribe/e2e/daml/daml.yaml and must match ledger's @daml/types dependency.
# When bumping, update both places.

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dpm (Daml Package Manager)
        run: |
          curl -sSL https://get.digitalasset.com/install/install.sh | sh
          echo "$HOME/.dpm/bin" >> $GITHUB_PATH

      - name: Install Daml SDK via dpm
        run: $HOME/.dpm/bin/dpm install 3.4.11

      - run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Scribe E2E Tests
        run: pnpm --filter @c7-digital/scribe test:e2e
